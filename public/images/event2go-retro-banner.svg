<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 490" width="100%" height="100%" fill="none">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0b1739"/>
            <stop offset="60%" stop-color="#0c1d48"/>
            <stop offset="100%" stop-color="#071126"/>
        </linearGradient>

        <!-- Monitor Blue Chassis -->
        <linearGradient id="chassisBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1460ff"/>
            <stop offset="100%" stop-color="#0038aa"/>
        </linearGradient>

        <linearGradient id="chassisSideBlue" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#003599"/>
            <stop offset="100%" stop-color="#002673"/>
        </linearGradient>

        <!-- Screen Bezel Orange -->
        <linearGradient id="bezelOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff6b2b"/>
            <stop offset="100%" stop-color="#e63c00"/>
        </linearGradient>

        <!-- Screen CRT Glow -->
        <linearGradient id="crtScreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff7f2"/>
            <stop offset="100%" stop-color="#ffe9de"/>
        </linearGradient>

        <!-- Keyboard Gradients -->
        <linearGradient id="kbBezel" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff7b3d"/>
            <stop offset="100%" stop-color="#d93800"/>
        </linearGradient>
        <linearGradient id="kbTop" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fdfbf7"/>
            <stop offset="100%" stop-color="#e8e2d8"/>
        </linearGradient>

        <!-- Yellow Ribbon Pattern -->
        <linearGradient id="yellowRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffe600"/>
            <stop offset="100%" stop-color="#ffd000"/>
        </linearGradient>

        <!-- Shadow filter -->
        <filter id="retroShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="-4" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.6"/>
        </filter>
        <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Outer Rounded Canvas -->
    <rect width="380" height="490" rx="28" fill="url(#bgGrad)"/>
    <rect width="378" height="488" x="1" y="1" rx="27" stroke="#1e3a8a" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Watermark Background Typography "EVENT EVENT" -->
    <g font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="30" fill="#1d356d" opacity="0.4" letter-spacing="3">
        <text x="18" y="145">EVENT</text>
        <text x="18" y="180">EVENT</text>
        <text x="18" y="325">EVENT</text>
        <text x="18" y="360">EVENT</text>
        <text x="250" y="325">WEEK</text>
    </g>

    <!-- Background Floor Perspective Grid -->
    <g stroke="#0ea5e9" stroke-opacity="0.25" stroke-width="1.2">
        <!-- Horizontal Grid Lines -->
        <line x1="20" y1="380" x2="360" y2="380"/>
        <line x1="15" y1="410" x2="365" y2="410"/>
        <line x1="10" y1="445" x2="370" y2="445"/>
        <line x1="5" y1="480" x2="375" y2="480"/>

        <!-- Perspective Vanishing Lines -->
        <line x1="190" y1="350" x2="20" y2="490"/>
        <line x1="190" y1="350" x2="70" y2="490"/>
        <line x1="190" y1="350" x2="130" y2="490"/>
        <line x1="190" y1="350" x2="190" y2="490"/>
        <line x1="190" y1="350" x2="250" y2="490"/>
        <line x1="190" y1="350" x2="310" y2="490"/>
        <line x1="190" y1="350" x2="360" y2="490"/>
    </g>

    <!-- Yellow Ribbon behind Monitor -->
    <g transform="translate(140, 130) rotate(-3)">
        <rect x="0" y="0" width="180" height="28" rx="4" fill="url(#yellowRibbon)" filter="url(#retroShadow)"/>
        <rect x="15" y="4" width="150" height="2" fill="#0050ff" opacity="0.3"/>
        <rect x="15" y="22" width="150" height="2" fill="#0050ff" opacity="0.3"/>
        <text x="90" y="19" font-family="'Arial Black', sans-serif" font-weight="900" font-size="11" fill="#0b1739" text-anchor="middle" letter-spacing="2">SETIKET.COM</text>
    </g>

    <!-- Top Left SeTiket Logo Badge -->
    <g transform="translate(26, 26)">
        <rect width="44" height="44" rx="12" fill="#ffffff" filter="url(#retroShadow)"/>
        <!-- Stylized Bold 'S' Icon in Blue -->
        <path d="M15 15H27C28.1 15 29 15.9 29 17V20C29 21.1 28.1 22 27 22H18C16.9 22 16 22.9 16 24V27C16 28.1 16.9 29 18 29H29" stroke="#0050ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="15" cy="15" r="2.5" fill="#00c0fa"/>
    </g>

    <!-- ============================================== -->
    <!-- ISOMETRIC RETRO COMPUTER ILLUSTRATION (3D)    -->
    <!-- ============================================== -->
    <g filter="url(#retroShadow)">
        <!-- BASE / SHADOW ON FLOOR -->
        <ellipse cx="185" cy="405" rx="140" ry="25" fill="#030712" opacity="0.5"/>

        <!-- 1. LEFT SIDE OF MONITOR HOUSING (Extrusion / Shading) -->
        <polygon points="55,275 125,105 150,110 90,290" fill="url(#chassisSideBlue)"/>
        <polygon points="55,275 90,290 85,340 50,320" fill="#00216b"/>

        <!-- Side Stickers on Blue Housing -->
        <!-- Rainbow Arc Sticker -->
        <g transform="translate(68, 230) rotate(-15)">
            <path d="M0,20 A16,16 0 0,1 28,20" stroke="#ff3838" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M3,20 A13,13 0 0,1 25,20" stroke="#ff9f1a" stroke-width="3" fill="none"/>
            <path d="M6,20 A10,10 0 0,1 22,20" stroke="#ffea00" stroke-width="3" fill="none"/>
            <path d="M9,20 A7,7 0 0,1 19,20" stroke="#00d26a" stroke-width="3" fill="none"/>
            <path d="M12,20 A4,4 0 0,1 16,20" stroke="#0050ff" stroke-width="3" fill="none"/>
            <circle cx="0" cy="20" r="3" fill="#ffffff"/>
            <circle cx="28" cy="20" r="3" fill="#ffffff"/>
        </g>

        <!-- Rosette Medal Badge Sticker -->
        <g transform="translate(85, 175) rotate(-10)">
            <circle cx="10" cy="10" r="10" fill="#00c0fa" stroke="#ffffff" stroke-width="1.5"/>
            <circle cx="10" cy="10" r="6" fill="#f59e0b"/>
            <!-- Ribbons -->
            <polygon points="5,17 3,26 8,23 10,26 10,18" fill="#0050ff"/>
            <polygon points="10,18 10,26 12,23 17,26 15,17" fill="#0038aa"/>
            <circle cx="10" cy="10" r="2.5" fill="#ffffff"/>
        </g>

        <!-- 2. FRONT BEZEL OF MONITOR (Vibrant Orange Frame) -->
        <!-- Trapezoid / Isometric Front Face -->
        <polygon points="125,105 315,145 280,335 90,290" fill="url(#bezelOrange)"/>
        <polygon points="125,105 315,145 311,155 125,115" fill="#ff8c52"/> <!-- Top Bevel Highlight -->

        <!-- CRT SCREEN INSET (Cream / Off-White) -->
        <polygon points="140,135 295,168 268,310 115,275" fill="url(#crtScreen)"/>
        <!-- CRT Screen Subtle Inner Shadow -->
        <polygon points="140,135 295,168 290,178 143,145" fill="#e6d4c5" opacity="0.6"/>
        <polygon points="140,135 143,145 118,272 115,275" fill="#d9c2b0" opacity="0.5"/>

        <!-- SCREEN PIXEL TEXT: "EVENT \n ▶ 2 GO \n THIS WEEK" -->
        <g transform="translate(195, 215) rotate(10)" font-family="'Impact', 'Arial Black', monospace" text-anchor="middle">
            <!-- Line 1: EVENT -->
            <text x="0" y="-30" font-size="28" fill="#e63c00" letter-spacing="4" font-weight="900">EVENT</text>
            
            <!-- Line 2: ▶ 2 GO -->
            <g transform="translate(-5, 5)">
                <!-- Small Pixel Arrow / Play Icon -->
                <polygon points="-46,-12 -34,-6 -46,0" fill="#00216b"/>
                <text x="6" y="0" font-size="32" fill="#e63c00" letter-spacing="3" font-weight="900">2 GO</text>
            </g>

            <!-- Line 3: THIS WEEK -->
            <text x="0" y="38" font-size="21" fill="#e63c00" letter-spacing="2" font-weight="900">THIS WEEK</text>
        </g>

        <!-- 3. LOWER COMPUTER HOUSING (Cream / Light Blue / Floppy Drive) -->
        <!-- Front bottom panel -->
        <polygon points="90,290 280,335 265,395 75,345" fill="#f4ede2"/>
        <polygon points="50,320 90,290 75,345 35,370" fill="#003599"/>

        <!-- Floppy Drive Slot (Isometric Dark Blue) -->
        <g>
            <polygon points="110,325 210,348 207,358 107,335" fill="#001850"/>
            <polygon points="111,328 205,349 203,353 109,332" fill="#0a0a0a"/>
            <!-- Floppy Eject Button & LED -->
            <rect x="215" y="348" width="6" height="4" rx="1" fill="#e63c00" transform="rotate(12 215 348)"/>
            <circle cx="102" cy="331" r="2" fill="#22c55e"/>
        </g>

        <!-- Speaker Vent Slats -->
        <g stroke="#ff5a22" stroke-width="2.5" stroke-linecap="round">
            <line x1="105" y1="362" x2="105" y2="373"/>
            <line x1="112" y1="363" x2="112" y2="375"/>
            <line x1="119" y1="365" x2="119" y2="376"/>
            <line x1="126" y1="366" x2="126" y2="378"/>
            <line x1="133" y1="368" x2="133" y2="379"/>
        </g>

        <!-- Small Website Sticker on Lower Panel -->
        <g transform="translate(170, 362) rotate(12)">
            <rect width="45" height="12" rx="3" fill="#00c0fa" opacity="0.9"/>
            <text x="22.5" y="8.5" font-family="'Arial', sans-serif" font-size="6.5" font-weight="bold" fill="#00216b" text-anchor="middle">setiket.com</text>
        </g>

        <!-- Megaphone Sticker on Front Panel -->
        <g transform="translate(175, 380) rotate(-15)">
            <polygon points="0,5 12,0 12,14 0,9" fill="#00c0fa"/>
            <polygon points="12,0 16,-2 16,16 12,14" fill="#ffffff" stroke="#003599" stroke-width="0.8"/>
            <rect x="-4" y="5" width="4" height="4" rx="1" fill="#e63c00"/>
            <path d="M-2,9 L-4,14 L-2,14 L0,9" fill="#e63c00"/>
            <!-- Sound waves -->
            <path d="M19,2 A6,6 0 0,1 19,12" stroke="#ff5a22" stroke-width="1.5" fill="none"/>
            <path d="M22,0 A10,10 0 0,1 22,14" stroke="#ff5a22" stroke-width="1.5" fill="none"/>
        </g>

        <!-- 4. ISOMETRIC RETRO KEYBOARD -->
        <g transform="translate(20, 20)">
            <!-- Keyboard Outer Shadow Base -->
            <polygon points="120,400 310,320 325,335 135,420" fill="url(#kbBezel)"/>
            <!-- Keyboard Top Deck -->
            <polygon points="120,400 310,320 295,310 105,390" fill="url(#kbTop)"/>
            
            <!-- Orange Front Lip -->
            <polygon points="105,390 120,400 135,420 120,410" fill="#c43000"/>
            
            <!-- Keyboard Keys Grid Impression -->
            <g stroke="#d5cbba" stroke-width="1.5" fill="none">
                <line x1="130" y1="388" x2="285" y2="323"/>
                <line x1="138" y1="394" x2="293" y2="329"/>
                <line x1="145" y1="400" x2="300" y2="335"/>
            </g>
            <!-- Spacebar / Keycap Accents -->
            <polygon points="160,404 220,379 223,382 163,407" fill="#ff5a22"/>
        </g>
    </g>
</svg>
